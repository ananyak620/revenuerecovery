[project]
name = "reviveai"
version = "0.1.0"
description = "AI/ML-powered Revenue Recovery Agent — predicts recovery probability, diagnoses payment failures, and executes bounded recovery workflows."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",

    # ML
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",

    # AI / GenAI
    "google-generativeai>=0.8.0",

    # MLOps
    "mlflow>=2.14.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]

prod = [
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "celery>=5.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
