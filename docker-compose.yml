version: '3.8'

services:
  reviveai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviveai_agent_service
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:///./data/reviveai.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    volumes:
      - reviveai_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  reviveai_data:
